apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-ssm
spec:
  provider:
    aws:
      service: ParameterStore
      region: eu-west-1
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: eso-credentials
            namespace: eso
            key: access-key-id
          secretAccessKeySecretRef:
            name: eso-credentials
            namespace: eso
            key: secret-access-key
